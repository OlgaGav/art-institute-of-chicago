<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Art Institute of Chicago</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="top">
        <img
          src="logo.svg"
          alt="logo of the Art Insitute of Chicago"
          class="logo"
        />
        <div class="title">
          <h1>The Art Institute of Chicago</h1>
          <h3>Explore artworks & artists</h3>
        </div>
      </div>
    </header>
    <section class="container">
      <p>
        Discover the painting searching the artwork by artist or collection, and
        you can view the list of the work in disposal of the Art institute of
        Chicago.
      </p>
      <div class="search-panel">
        <label>Explore artworks:</label>
        <input
          type="text"
          id="search-input"
          name="search"
          placeholder="Search artwork, collection ..."
        />
        <div class="buttons-group">
          <button id="search-artwork-button">Search artwork</button>
          <button id="search-artist-button">Search artist</button>
          <button id="clear-button">Clear</button>
        </div>
      </div>
    </section>
    <section id="search-results" class="results-panel">
      <p id="status">Enter a search term to find artwork or artist.</p>
      <div id="artworks" class="cards-grid"></div>
      <div id="artists" class="artists"></div>
    </section>
    <section id="detail-view" class="hidden">
      <button id="back-button">Back to results</button>
      <div id="detail-content"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
