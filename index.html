<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Art Institute of Chicago</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
  </head>
  <body>
    <header>
      <div>
        <img
          src="logo.svg"
          alt="logo of the Art Insitute of Chicago"
          class="logo"
        />
        <h1 id="title">The Art Institute of Chicago</h1>
      </div>
    </header>
    <section id="navigation">
      <p>
        Discover the painting searching the artwork by artist or collection, and
        you can view the list of the work in disposal of the Art institute of
        Chicago.
      </p>
      <div>
        <label for="search">Search by term or artist:</label>
        <input
          type="text"
          id="search"
          name="search"
          placeholder="Search artist, collection or by word ..."
          size="50"
        />
        <button>Search</button>
        <button>Clear</button>
      </div>
    </section>
    <section id="artworks">Results</section>

    <script src="script.js"></script>
  </body>
</html>
