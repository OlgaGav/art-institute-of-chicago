<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Art Institute of Chicago</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="top">
        <img
          src="logo.svg"
          alt="logo of the Art Insitute of Chicago"
          class="logo"
        />
        <div class="title">
          <h1>The Art Institute of Chicago</h1>
          <p>Explore artworks & artists</p>
        </div>
      </div>
    </header>
    <section class="container">
      <p>
        Discover the painting searching the artwork by artist or collection, and
        you can view the list of the work in disposal of the Art institute of
        Chicago.
      </p>
      <div>
        <label>Explore artworks:</label>
        <input
          type="text"
          id="search-input"
          name="search"
          placeholder="Search artist, collection or by word ..."
          size="50"
        />
        <button id="search-button">Search</button>
        <button id="clear-button">Clear</button>
      </div>
    </section>
    <section id="artworks">
      <p id="status">Enter a search term to find artwork.</p>
      <div id="results" class="cards-grid"></div>
      <div id="pagination"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
